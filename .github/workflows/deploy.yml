name: Deploy Dashboard to Azure

# 1. THE TRIGGER: Only run this robot when the main branch gets a new index.html
on:
  push:
    branches:
      - main
    paths:
      - 'index.html' 

# 2. THE PERMISSIONS: Allow the robot to request a secure SSO token from Azure
permissions:
  id-token: write 
  contents: read

# 3. THE JOBS: The actual steps the robot takes
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Grab the new code from the repository
        uses: actions/checkout@v4

      - name: Login to Azure securely (Zero-Trust OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload the new index.html to the $web folder
        run: |
          az storage blob upload-batch \
            --account-name evfleetkrgkiwiev \
            --destination '$web' \
            --source . \
            --pattern "index.html" \
            --overwrite true
