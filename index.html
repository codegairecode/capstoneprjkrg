<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Fleet Control Center</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 50px; }
        h1 { color: #4CAF50; font-size: 3em; }
        .stats-container { display: flex; justify-content: center; gap: 20px; margin-top: 40px; }
        .stat-box { background-color: #1e1e1e; padding: 30px; border-radius: 10px; width: 250px; border-top: 4px solid #4CAF50; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .stat-number { font-size: 2.5em; font-weight: bold; margin: 10px 0; }
        .status { color: #81c784; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Header/Logo Section -->
    <div style="background-color: #00509E; color: white; padding: 20px 40px; display: flex; align-items: center; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <!-- The "Logo" icon -->
        <span style="font-size: 40px; margin-right: 15px;">🌍</span>
        
        <!-- The Text -->
        <div>
            <h1 style="margin: 0; font-size: 28px; font-weight: bold; letter-spacing: 1px;">Saving Earth Forever</h1>
            <p style="margin: 5px 0 0 0; font-size: 14px; opacity: 0.9;">EV Fleet Management Dashboard</p>
        </div>
    </div>
    <h1>🔋 EV Fleet Control Center</h1>
    <p>Multi-Cloud Architecture: AWS + GCP + Azure</p>

    <div class="stats-container">
        <div class="stat-box">
            <h3>Active Vehicles</h3>
            <div class="stat-number">142</div>
            <div class="status">Online & Routing</div>
        </div>
        <div class="stat-box">
            <h3>Avg Fleet Battery</h3>
            <div class="stat-number">78%</div>
            <div class="status">Optimal Health</div>
        </div>
        <div class="stat-box">
            <h3>GCP Telemetry</h3>
            <div class="stat-number">Live</div>
            <div class="status">Syncing to BigQuery</div>
        </div>
    </div>
</body>
</html>
